name: Release

# Merging a version bump to main publishes it. The push trigger is filtered to package.json, and
# the plan job still checks npm, so a push that did not change the version publishes nothing.
# workflow_dispatch re-runs the same logic by hand, e.g. when only the tag and release step failed.
# The tag and GitHub Release are created inside this run: a release made with GITHUB_TOKEN does
# not start other workflows, so a separate release-triggered workflow would never fire.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      published: ${{ steps.plan.outputs.published }}
      released: ${{ steps.plan.outputs.released }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Is this version already on npm, and does its release exist?
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          # Plain x.y.z only: no prerelease would be published to the latest tag by accident, and the
          # value is safe to write to the outputs file and to use in a regular expression.
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Version '$version' is not x.y.z"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # An unknown version prints nothing; a failed lookup is treated the same, and a publish of
          # a version that does exist is then refused by npm, so the worst case is a failed run.
          if [ -n "$(npm view "@deepdockai/cli@${version}" version 2>/dev/null || true)" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$version is already on npm: nothing to publish"
          else
            latest="$(npm view @deepdockai/cli version 2>/dev/null || echo 0.0.0)"
            if [ "$(printf '%s\n%s\n' "$version" "$latest" | sort -V | head -n1)" = "$version" ]; then
              echo "package.json $version is not higher than npm $latest"
              exit 1
            fi
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "$version is new (npm has $latest)"
          fi

          if gh release view "v${version}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: needs.plan.outputs.published == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Changelog has an entry for this version
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: grep -qE "^## ${VERSION//./\\.}\$" CHANGELOG.md || { echo "CHANGELOG.md has no '## ${VERSION}' entry"; exit 1; }
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run format
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run test:node
      - run: bun run build
      - name: Pack once, scan that tarball, record its hash
        id: pack
        run: |
          mkdir "$RUNNER_TEMP/pack"
          name="$(npm pack --pack-destination "$RUNNER_TEMP/pack" --ignore-scripts --silent)"
          bun scripts/checkPublic.ts --tarball "$RUNNER_TEMP/pack/$name"
          echo "tarball=$name" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$RUNNER_TEMP/pack/$name" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: package
          path: ${{ runner.temp }}/pack/${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: package
          path: package
      - name: Verify the tarball is the one that was scanned
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
          EXPECTED: ${{ needs.build.outputs.sha256 }}
        run: echo "${EXPECTED}  package/${TARBALL}" | sha256sum --check --strict
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer; pinned so a release never runs a new npm
      # unreviewed. There is no NODE_AUTH_TOKEN secret, and no source code is checked out here.
      - run: npm install -g npm@11.6.2
      - name: Publish that exact tarball
        env:
          TARBALL: ${{ needs.build.outputs.tarball }}
        run: npm publish "./package/${TARBALL}" --provenance --access public

  # Runs after a fresh publish, and also when the version was already on npm but its release is
  # missing: "Re-run all jobs" (or a manual dispatch) recovers that, "Re-run failed jobs" does not
  # when the publish job itself failed after uploading. It is the only job with write access, and it runs
  # no repository code: it reads CHANGELOG.md and calls gh.
  release:
    needs: [plan, publish]
    if: >-
      !cancelled() && needs.plan.result == 'success'
      && (needs.plan.outputs.published == 'true' || needs.publish.result == 'success')
      && needs.plan.outputs.released == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Tag and GitHub Release with the changelog entry as notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
          PUBLISHED: ${{ needs.plan.outputs.published }}
        run: |
          # A fresh publish is built from this run's commit. A recovery run (the version was already on
          # npm) may start from a later main, so the tag goes on the commit npm recorded for the package.
          if [ "$PUBLISHED" = "true" ]; then
            target="$(npm view "@deepdockai/cli@${VERSION}" gitHead)"
            test -n "$target" || { echo "npm has no gitHead for $VERSION: tag it by hand"; exit 1; }
          else
            target="$GITHUB_SHA"
          fi
          # An existing tag is kept by gh and --target is ignored, so refuse one on another commit.
          if existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${VERSION}" --jq .object.sha 2>/dev/null)"; then
            test "$existing" = "$target" || { echo "Tag v${VERSION} exists on ${existing}, not ${target}"; exit 1; }
          fi
          git show "${target}:CHANGELOG.md" | awk -v v="$VERSION" '
            /^## / { if (found) exit; found = ($2 == v); next }
            found { print }
          ' > "$RUNNER_TEMP/notes.md"
          grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no entry for $VERSION"; exit 1; }
          gh release create "v${VERSION}" --repo "$GITHUB_REPOSITORY" --target "$target" \
            --title "v${VERSION}" --notes-file "$RUNNER_TEMP/notes.md"
